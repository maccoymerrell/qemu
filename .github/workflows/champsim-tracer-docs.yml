# Build the champsim_tracer Sphinx docs and deploy to GitHub Pages.
#
# Triggered on pushes to champsim-trace that touch the docs source or
# the format/basic-block markdown next to the plugin.
#
# REQUIRED REPO SETTING: Settings -> Pages -> "Build and deployment"
#                        -> "Source: GitHub Actions"
#
# If Pages is set to "Deploy from a branch", the upload-pages-artifact
# / deploy-pages flow is silently ignored and the site instead serves
# whatever is at the configured branch path (typically /docs at the
# repo root, i.e. QEMU's own root docs/ directory — not this plugin's
# contrib/plugins/champsim_tracer/docs/_build/html output).

name: champsim_tracer docs

on:
  push:
    branches: [champsim-trace]
    paths:
      - 'contrib/plugins/champsim_tracer/docs/**'
      - 'contrib/plugins/champsim_tracer/champsim_tracer_format.md'
      - 'contrib/plugins/champsim_tracer/basic_block.md'
      - '.github/workflows/champsim-tracer-docs.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: champsim-tracer-docs
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Sphinx
        run: pip install sphinx furo myst-parser

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build HTML
        run: make -C contrib/plugins/champsim_tracer/docs html

      # PDF build is best-effort.  Failure (TeX install hiccup, font
      # substitution, etc.) doesn't fail the workflow — HTML still
      # ships, and the PDF artifact step is skipped via the
      # always()/success() shortcut on the upload step.
      - name: Install TeX for PDF
        run: |
          sudo apt-get update
          # texlive-xetex pulls in xelatex; texlive-latex-recommended
          # carries the bundled Sphinx classes; latexmk drives the
          # multi-pass build.  fonts-freefont-otf supplies FreeSerif
          # which Sphinx's xelatex template selects as the default
          # body face — texlive-fonts-recommended does NOT include it,
          # and the build aborts with "fontspec Error: The font
          # FreeSerif cannot be found" without it.
          sudo apt-get install -y --no-install-recommends \
            texlive-xetex texlive-latex-recommended \
            texlive-fonts-recommended texlive-fonts-extra \
            fonts-freefont-otf latexmk
        continue-on-error: true

      - name: Build PDF
        id: build_pdf
        run: make -C contrib/plugins/champsim_tracer/docs latexpdf
        continue-on-error: true

      - name: Stage PDF alongside HTML
        if: steps.build_pdf.outcome == 'success'
        run: |
          cp contrib/plugins/champsim_tracer/docs/_build/latex/champsim_tracer.pdf \
             contrib/plugins/champsim_tracer/docs/_build/html/champsim_tracer.pdf

      - uses: actions/upload-pages-artifact@v3
        with:
          path: contrib/plugins/champsim_tracer/docs/_build/html

      # Also publish the PDF as a standalone workflow artifact so
      # users can download it without the full Pages site or wait
      # for deploy.  Skipped when the PDF build failed.
      - uses: actions/upload-artifact@v4
        if: steps.build_pdf.outcome == 'success'
        with:
          name: champsim_tracer-pdf
          path: contrib/plugins/champsim_tracer/docs/_build/latex/champsim_tracer.pdf
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
